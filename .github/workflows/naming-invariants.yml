name: naming-invariants

# Guard the public site's pre-launch naming truth on every pull request as it
# is opened and on each new push to the PR branch (synchronize) or when it is
# reopened. Fails the build if a visible "forge" reappears, if the hidden
# portage/landing tool cards or install block leak into visible copy, or if
# the visible tool count drifts from the pre-launch 3.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # Cancel an in-flight run when the PR branch gets a newer push.
  group: naming-invariants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: naming invariants
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check naming invariants in index.html
        run: |
          python3 - <<'PYEOF'
          import re
          import sys

          with open("index.html", encoding="utf-8") as f:
              raw = f.read()

          # Strip HTML comments so hidden (not-yet-launched) content never
          # counts as visible.
          visible = re.sub(r"<!--.*?-->", "", raw, flags=re.DOTALL)

          failures = []

          # 1. No visible "forge" (word-boundary, case-insensitive — a naive
          # substring match would false-positive on words like "forget").
          if re.search(r"(?i)\bforge\b", visible):
              failures.append('visible "forge" found (word-boundary match)')

          # 2. No visible "portage" or "landing" tool names ahead of launch.
          if re.search(r"(?i)\bportage\b", visible):
              failures.append('visible "portage" found (word-boundary match)')
          if re.search(r"(?i)\blanding\b", visible):
              failures.append('visible "landing" found (word-boundary match)')

          # 3. The staged install command must not leak.
          if "git clone" in visible:
              failures.append('visible "git clone" install command found')

          # 4. Exactly 3 visible .tool cards until the launch flip.
          tool_count = len(re.findall(r'<article class="tool">', visible))
          if tool_count != 3:
              failures.append(
                  f"expected exactly 3 visible .tool cards, found {tool_count}"
              )

          if failures:
              for msg in failures:
                  print(f"::error::{msg}")
              sys.exit(1)

          print("naming invariants OK")
          PYEOF
